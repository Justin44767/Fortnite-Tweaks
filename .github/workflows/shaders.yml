name: Shader compilation and packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mesa and development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libgl1
          python -m pip install -r requirements-dev.txt
      - name: Compile programs and run synthetic GPU checks
        run: python tools/validate.py
      - name: Build and verify reproducible archives
        run: |
          python tools/build.py
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: NeroRealismUltra-technical-test-build
          path: |
            dist/*.zip
            dist/*.sha256
            build/validation/
